  <rect x="102.4" y="102.4" width="819.2" height="819.2" rx="182.4" fill="url(#bg)" filter="url(#dropshadow)"/>
  <rect x="102.4" y="102.4" width="819.2" height="819.2" rx="182.4" fill="url(#glow)"/>

